<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f6f2" />
    <meta name="description" content="KPSS A Maliye için kişisel, adım adım çalışma masası." />
    <title>Maliye — Çalışma Masam</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Ana menü">
        <a class="brand" href="#home" aria-label="Maliye çalışma masası">
          <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 7.5h17M8 16h13M8 24.5h17M5 5v22" /></svg></span>
          <span><strong>maliye</strong><small>çalışma masam</small></span>
        </a>
        <div class="side-label">ÇALIŞMA ALANI</div>
        <nav class="primary-nav">
          <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span>Çalışma masam</span></button>
          <button class="nav-item" data-view="courses"><span class="nav-icon">▤</span><span>Dersler</span><span class="nav-count" id="nav-course-count">31</span></button>
          <button class="nav-item" data-view="reviews"><span class="nav-icon">↻</span><span>Tekrarlar</span><span class="nav-count" id="nav-review-count">0</span></button>
          <button class="nav-item" data-view="stats"><span class="nav-icon">▥</span><span>İstatistikler</span></button>
        </nav>
        <div class="sidebar-foot">
          <div class="sync-mini"><span class="status-dot" id="sync-dot"></span><span id="sync-mini-label">Bu cihazda kaydediliyor</span></div>
          <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Ayarlar</span></button>
          <div class="profile-mini"><div class="avatar">M</div><div><strong>Kişisel çalışma</strong><small id="profile-label">Çevrimdışı kayıt açık</small></div><button class="tiny-icon" data-view="settings" aria-label="Ayarları aç">···</button></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark small"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 7.5h17M8 16h13M8 24.5h17M5 5v22" /></svg></span><strong>maliye</strong></div>
          <div class="breadcrumb" id="breadcrumb">Kişisel çalışma alanın</div>
          <div class="top-actions"><button class="icon-button" id="quick-search" data-action="search" title="Ders ara" aria-label="Ders ara">⌕</button><button class="icon-button" data-view="settings" title="Ayarlar" aria-label="Ayarlar">⚙</button><div class="avatar top-avatar">M</div></div>
        </header>
        <div id="app" class="page-content" aria-live="polite"></div>
        <footer class="app-footer"><span>Her kısa çalışma bir adım ileri.</span><span>KPSS A · Maliye</span></footer>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
