name: Build and publish Maliye çalışma masası

on:
  push:
    branches:
      - codex/study-app
    paths:
      - "maliye/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v6
      - name: Python hazırla
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: P.A.C.E.R. çalışma içeriklerini oluştur
        run: |
          python scripts/test_build_content.py
          python scripts/build_content.py
      - name: Yayımdaki dosyaları önbellekten ayır
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          index = Path("site/index.html")
          html = index.read_text()
          version = os.environ["RELEASE_SHA"][:12]
          for asset in ("styles.css", "app.js", "vendor/dagre.min.js"):
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          index.write_text(html)
          PY
      - name: GitHub Pages kullan
        uses: actions/configure-pages@v6
      - name: Site paketini hazırla
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Siteyi yayımla
        id: deployment
        uses: actions/deploy-pages@v5
