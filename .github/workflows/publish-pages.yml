name: Validate and publish OL Atölye

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v6
      - name: Node hazırla
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Python hazırla
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test bağımlılıklarını kur
        run: npm ci
      - name: HTML dosyalarını oluştur
        run: npm run build
      - name: İşlevleri doğrula
        run: npm test
      - name: GitHub Pages kullan
        uses: actions/configure-pages@v6
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          cp index.html OL_Atolye_Editor.html .nojekyll _site/
      - name: Site paketini hazırla
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Siteyi yayımla
        id: deployment
        uses: actions/deploy-pages@v5
